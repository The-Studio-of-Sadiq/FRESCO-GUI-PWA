<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="frescoFluidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#06B6D4"/>
        <stop offset="40%" stop-color="#22D3EE"/>
        <stop offset="70%" stop-color="#3563EB"/>
        <stop offset="100%" stop-color="#1E40AF"/>
      </linearGradient>

      <linearGradient id="frescoFluidGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00F0FF"/>
        <stop offset="100%" stop-color="#3B82F6"/>
      </linearGradient>

      <filter id="frescoGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="7.68" result="blur"/>
        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
      </filter>
    </defs>

    <rect width="512" height="512" fill="#0B132B"/>

    
      <!-- ICON ONLY LAYOUT -->
      <g transform="translate(76.8, 76.8) scale(0.8959999999999999)">
        <!-- Main Fluid Flow Curve (F Stem + Top Swirl + Middle Wing) -->
        <path d="M 90,60 
                 C 150,30 250,25 320,50 
                 C 260,85 190,95 150,110 
                 C 200,125 280,120 330,150 
                 C 260,185 180,185 140,210 
                 L 115,350 
                 C 105,375 75,370 70,345 
                 C 65,300 70,180 90,60 Z" 
              fill="url(#frescoFluidGrad)" 
              filter="url(#frescoGlow)"/>

        <path d="M 120,75 
                 C 170,50 250,55 300,75 
                 C 250,95 180,105 140,120 Z" 
              fill="#E0F2FE" opacity="0.4"/>

        <!-- SPH Particles (Mobile Nodes) Constellation -->
        <circle cx="35" cy="310" r="14" fill="#00F0FF"/>
        <circle cx="50" cy="270" r="10" fill="#22D3EE"/>
        <circle cx="25" cy="230" r="8" opacity="0.8" fill="#38BDF8"/>
        <circle cx="45" cy="180" r="12" fill="#06B6D4"/>
        <circle cx="60" cy="130" r="9" opacity="0.9" fill="#00F0FF"/>
        <circle cx="75" cy="80" r="7" opacity="0.7" fill="#60A5FA"/>

        <circle cx="345" cy="55" r="11" fill="#00F0FF" filter="url(#frescoGlow)"/>
        <circle cx="365" cy="80" r="7" fill="#38BDF8"/>
        <circle cx="345" cy="155" r="9" fill="#00F0FF" filter="url(#frescoGlow)"/>
        <circle cx="365" cy="175" r="6" fill="#60A5FA"/>
      </g>
    
  </svg>