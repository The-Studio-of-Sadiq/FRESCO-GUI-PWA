<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FRESCO PWA GUI</title>
    
    <!-- Primary Brand Meta -->
    <meta name="description" content="FRESCO — Advanced Coupled-Channels & Nuclear Reaction Physics Simulator. Powered by Physics. Driven by Curiosity." />
    <meta name="author" content="Golam Kuadir Khan Prince, Md. Sujan Islam, Pankaj Bhowmik, HSTU Research Society" />
    <meta name="creator" content="Golam Kuadir Khan Prince (Dept. of EEE, CSE Faculty, HSTU), Md. Sujan Islam (Dept. of Physics, Science Faculty, HSTU), Pankaj Bhowmik (Dept. of CSE, CSE Faculty, HSTU), HSTU Research Society" />
    <meta name="publisher" content="Hajee Mohammad Danesh Science and Technology University (HSTU)" />
    <meta name="theme-color" content="#0B132B" />

    <!-- PWA Web App Meta -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FRESCO" />

    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Favicon & Vector Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FRESCO PWA GUI — Nuclear Physics & Reaction Simulator" />
    <meta property="og:description" content="Simulating the Complexity of Nuclear Physics. Coupled-channels solver, interactive angular distribution plotter, and deck generator." />
    <meta property="og:image" content="/images/fresco_og_image.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FRESCO PWA GUI — Nuclear Physics & Reaction Simulator" />
    <meta name="twitter:description" content="Simulating the Complexity of Nuclear Physics. Coupled-channels solver, interactive angular distribution plotter, and deck generator." />
    <meta name="twitter:image" content="/images/fresco_og_image.jpg" />
  </head>
  <body class="bg-[#0B132B] text-slate-100 font-sans antialiased selection:bg-cyan-500 selection:text-slate-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('[PWA] Service Worker registered successfully:', reg.scope))
            .catch(err => console.warn('[PWA] Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
